name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  native-tahoe:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Native window hit tests on Tahoe
        run: |
          mkdir -p build/module-cache
          xcrun swiftc -swift-version 5 -parse-as-library -module-cache-path build/module-cache -framework AppKit Sources/CaptureSelection.swift Sources/WindowHitTest.swift Tests/WindowHitNativeTests.swift -o build/window-hit-native-tests
          build/window-hit-native-tests
  macos:
    needs: native-tahoe
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Logic, native window hit and clipboard tests
        run: bash scripts/test.sh --require-pasteboard --require-window-hit
      - name: Build and package universal application
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: HoverCapture-macOS
          path: dist/
